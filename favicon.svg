<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JeyZimTech favicon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06161f"/>
      <stop offset="100%" stop-color="#0b2b3a"/>
    </linearGradient>
    <linearGradient id="jStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fffe9"/>
      <stop offset="100%" stop-color="#00b6ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#1a4b5f" stroke-width="2"/>

  <g stroke="#2a6f8f" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M10 18 H20"/>
    <path d="M44 18 H54"/>
    <path d="M10 46 H20"/>
    <path d="M44 46 H54"/>
    <path d="M18 10 V18"/>
    <path d="M46 10 V18"/>
    <path d="M18 46 V54"/>
    <path d="M46 46 V54"/>
  </g>

  <g fill="#35d9ff">
    <circle cx="10" cy="18" r="2"/>
    <circle cx="54" cy="18" r="2"/>
    <circle cx="10" cy="46" r="2"/>
    <circle cx="54" cy="46" r="2"/>
  </g>

  <path d="M39 15 V37 C39 45 34 50 26 50 C20 50 15 46 14 40"
        fill="none"
        stroke="url(#jStroke)"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>
</svg>
